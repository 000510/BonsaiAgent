plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.bonsaiagent'
    compileSdk 34
    ndkVersion "26.3.11579264"   // 与 CI 里 sdkmanager 安装的 NDK 版本保持一致

    defaultConfig {
        applicationId "com.example.bonsailite"
        minSdk 26            // Android 8.0，覆盖绝大多数现役手机
        targetSdk 34
        versionCode 82
        versionName "10.44"

        // 只编 arm64（手机主流，体积也小）
        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                version "3.22.1"
                cppFlags "-std=c++17 -O2"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    // 固定签名：以后每次编译都用同一把钥匙，覆盖安装不再报“软件包冲突”
    signingConfigs {
        fixed {
            storeFile file("bonsai.jks")
            storePassword "bonsai2026"
            keyAlias "bonsai"
            keyPassword "bonsai2026"
        }
        // Bonsai Lite 独立签名：与 BonsaiAgent 证书不同，可共存安装
        lite {
            storeFile file("bonsailite.jks")
            storePassword "bonsai2026"
            keyAlias "bonsailite"
            keyPassword "bonsai2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.lite
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.lite
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // v10.20：litertlm-android 是用 Kotlin 2.4 编译的，metadata 版本 2.4.0，
        // 而本项目的 Kotlin 是 1.9.24（只能读 ≤2.0）。
        // 这里跳过版本检查先试一把 —— 如果 API 签名实际兼容，就能省掉整条工具链升级；
        // 如果运行时崩（NoSuchMethodError / ClassCastException），就只能升级 Kotlin。
        freeCompilerArgs += ['-Xskip-metadata-version-check']
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }

    // 把 .so 打进 APK
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.2'

    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'androidx.compose.material:material-icons-extended:1.6.8'
    implementation 'androidx.compose.ui:ui-text-google-fonts:1.6.8'

    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'   // 用于调用 DeepSeek 云端

    // v10.20：LiteRT-LM —— 走天玑 9300 的 NPU 推理。
    //
    // 为什么值得：llama.cpp 在联发科阵营没有 NPU 后端（只有高通的 ggml-hexagon），
    // 而 Google 与联发科合作的 LiteRT NeuroPilot Accelerator 官方支持 MT6989（9300）。
    // 预期 prefill 能到 100+ tok/s，decode 15~25 tok/s。
    //
    // 注意：这条依赖如果拉不下来或要求更高 compileSdk，编译会直接报错，
    // 到时候把这一行注释掉即可回到纯 llama.cpp 路径。
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.1'

    // v10.28【关键】Google 官方发布的联发科 NPU 运行时，AAR 里直接带两个 .so：
    //   libLiteRtDispatch_MediaTek.so    （LiteRT 的 NPU 调度器，330 KB）
    //   libLiteRtCompilerPlugin_MediaTek.so（NPU 编译插件，429 KB）
    // 打包后它们会落在 nativeLibraryDir；litertlm 通过 Backend.NPU(nativeLibraryDir) 去加载。
    // 这两个库会自己按顺序 dlopen：libneuronusdk_adapter.mtk.so → libneuronusdk_adapter.9/10.mtk.so
    //   → libneuronusdk_adapter.so → libneuron_adapter.so → libneuron_adapter_mgvi.so
    // 也就是说：**只要把 adapter 那个 .so 放进 APK，就能绕过系统分区限制**。
    implementation 'com.google.ai.edge.litert:litert-npu-runtime-mediatek:2.3.2'
}
