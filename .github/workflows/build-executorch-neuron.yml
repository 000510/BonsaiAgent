name: build-executorch-neuron

# 目标：编出 libneuron_backend.so（ExecuTorch 的 MediaTek NPU 后端）
# 依据：executorch/backends/mediatek/README.md
#   - NDK 26.3.11579264
#   - NeuronAdapter.h 放到 backends/mediatek/runtime/include/api/
#   - mtk_build.sh 内部用 -DEXECUTORCH_BUILD_NEURON=ON
# 前置：仓库 Release 里需有一个 tag=sdk 的 release，附上 sdk_libs.tar.gz
#       包内需包含：libneuronusdk_adapter.mtk.so、libneuron_buffer_allocator.so、NeuronAdapter.h

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 环境自检
        run: |
          python3 -V
          df -h /
          nproc
          free -g

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 安装基础依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake unzip wget git

      - name: 安装 Android NDK 26.3
        run: |
          NDK=android-ndk-r26d
          wget -q "https://dl.google.com/android/repository/${NDK}-linux.zip"
          unzip -q "${NDK}-linux.zip"
          echo "ANDROID_NDK=$PWD/${NDK}" >> $GITHUB_ENV
          ls $PWD/${NDK}

      - name: 拉取 NeuroPilot SDK 库文件
        run: |
          mkdir -p $HOME/sdk
          curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o $HOME/sdk_libs.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/sdk/sdk_libs.tar.gz"
          tar -xzf $HOME/sdk_libs.tar.gz -C $HOME/sdk
          echo "--- SDK 内容 ---"
          find $HOME/sdk -type f -exec ls -lh {} \; | awk '{print $5, $9}'

      - name: 克隆 ExecuTorch
        run: |
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/pytorch/executorch.git
          du -sh executorch
          df -h /

      - name: 放置 NeuronAdapter.h
        run: |
          mkdir -p executorch/backends/mediatek/runtime/include/api
          H=$(find $HOME/sdk -name "NeuronAdapter.h" | head -1)
          echo "header: $H"
          cp "$H" executorch/backends/mediatek/runtime/include/api/
          ls -l executorch/backends/mediatek/runtime/include/api/

      - name: 安装 Python 依赖
        run: |
          python3 -m pip install --upgrade pip
          # 只装构建需要的核心项；piq 等可选依赖失败不阻塞
          pip3 install numpy pyyaml typing_extensions flatbuffers || true
          if [ -f executorch/backends/mediatek/requirements.txt ]; then
            pip3 install -r executorch/backends/mediatek/requirements.txt || echo "部分可选依赖安装失败，继续"
          fi

      - name: 编译 libneuron_backend.so
        run: |
          export ANDROID_NDK=$ANDROID_NDK
          cd executorch/backends/mediatek/scripts
          chmod +x mtk_build.sh
          ./mtk_build.sh
          echo "--- 产物 ---"
          find $GITHUB_WORKSPACE/executorch/cmake-android-out -name "*.so" -exec ls -lh {} \; | awk '{print $5, $9}'

      - name: 收集产物
        run: |
          mkdir -p out
          find executorch/cmake-android-out -name "libneuron_backend.so" -exec cp -v {} out/ \;
          find executorch/cmake-android-out -name "libexecutorch*.so" -exec cp -v {} out/ \; || true
          cp -v $HOME/sdk/libneuronusdk_adapter.mtk.so out/ 2>/dev/null || true
          cp -v $HOME/sdk/libneuron_buffer_allocator.so out/ 2>/dev/null || true
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: neuron-backend-arm64
          path: out/
          if-no-files-found: warn
