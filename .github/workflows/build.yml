name: Build APK (云端自动编译)

# 触发：推送到 main 分支，或手动在 Actions 页点 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK / NDK / CMake
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: 克隆 PrismML llama.cpp（prism 分支）
        run: |
          cd app/src/main/cpp
          # v5.0：换回 prism 分支。
          # 原因：Ternary-Bonsai-8B-Q2_0 是 Prism 私有的 g128 三值布局（PQ2_0=142），
          # 主线 llama.cpp 只有 Q2_0=42（g64），按 g64 解读会读错张量。
          # prism 是主线的超集，标准 GGUF（Qwen 等）照样能跑，所以一个引擎通吃两类模型。
          git clone --branch prism --depth 1 https://github.com/PrismML-Eng/llama.cpp llamacpp
          cd llamacpp
          git submodule update --init --recursive || true

      - name: 修补 sgemm 参数断言（改成优雅回退）
        run: |
          cd app/src/main/cpp/llamacpp
          ls -l ggml/src/ggml-cpu/llamafile/sgemm.cpp
          python3 "$GITHUB_WORKSPACE/tools/patch_sgemm.py" ggml/src/ggml-cpu/llamafile/sgemm.cpp

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: 编译 Debug APK
        run: |
          # 直接用 gradle 命令（仓库里没有 gradlew，之前靠 action 代跑，
          # 但它的输出被折叠，日志 API 里一条 Kotlin 错误都看不到）
          set +e
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          RC=$?
          echo "===== 编译退出码 $RC ====="
          echo "----- 错误行 -----"
          grep -n "^e: \|error: \|Unresolved" build.log | head -25 || true
          echo "----- 最后 40 行 -----"
          tail -40 build.log || true
          exit $RC

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: 发布到 Release（手机可直接下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "version = $VER"
          cp app/build/outputs/apk/debug/app-debug.apk "BonsaiLite-v$VER.apk"
          gh release delete "v$VER" --repo ${{ github.repository }} --yes || true
          gh release create "v$VER" "BonsaiLite-v$VER.apk" \
            --repo ${{ github.repository }} \
            --title "BonsaiLite v$VER" \
            --notes "自动构建 ${{ github.sha }}"
