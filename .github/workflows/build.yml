name: Build APK (云端自动编译)

# 触发：推送到 main 分支，或手动在 Actions 页点 Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK / NDK / CMake
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.3.11579264" "cmake;3.22.1"
          # v9.0：Vulkan 后端需要 glslc 把 compute shader 编成 SPIR-V
          sudo apt-get update -qq
          # glslc 把 compute shader 编成 SPIR-V；SPIRV-Headers/Tools 是 llama.cpp
          # Vulkan 后端的 find_package 硬依赖，缺了会在 CMake 配置阶段直接失败
          sudo apt-get install -y -qq glslc || sudo apt-get install -y -qq shaderc
          sudo apt-get install -y -qq spirv-headers spirv-tools libvulkan-dev || true
          glslc --version
          dpkg -L spirv-headers 2>/dev/null | grep -i config | head -3 || true
          # NDK 的 sysroot 只带 C 接口 vulkan.h，没有 C++ 绑定 vulkan.hpp，
          # 而 llama.cpp 的 Vulkan 后端用的是 vulkan-hpp。从主机拷过去补齐。
          NINCDIR=$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
          ls $NINCDIR/vulkan/ | head -5
          sudo cp -n /usr/include/vulkan/*.hpp $NINCDIR/vulkan/ 2>/dev/null || true
          echo "--- 拷贝后 ---"
          ls $NINCDIR/vulkan/ | head -8

      - name: 克隆 PrismML llama.cpp（prism 分支）
        run: |
          cd app/src/main/cpp
          # v5.0：换回 prism 分支。
          # 原因：Ternary-Bonsai-8B-Q2_0 是 Prism 私有的 g128 三值布局（PQ2_0=142），
          # 主线 llama.cpp 只有 Q2_0=42（g64），按 g64 解读会读错张量。
          # prism 是主线的超集，标准 GGUF（Qwen 等）照样能跑，所以一个引擎通吃两类模型。
          git clone --branch prism --depth 1 https://github.com/PrismML-Eng/llama.cpp llamacpp
          cd llamacpp
          git submodule update --init --recursive || true

      - name: 修补 sgemm 参数断言（改成优雅回退）
        run: |
          cd app/src/main/cpp/llamacpp
          ls -l ggml/src/ggml-cpu/llamafile/sgemm.cpp
          python3 "$GITHUB_WORKSPACE/tools/patch_sgemm.py" ggml/src/ggml-cpu/llamafile/sgemm.cpp

      - name: 编译 Debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.9
          arguments: assembleDebug

      - name: 上传 APK 作为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # ==========================================================================
  # 对比实验：同一份源码，分别用 prism 分支和主线各编一个 x86 版 llama-cli，
  # 跑同一个标准模型。用来判断"llama_decode 静默崩溃"到底是
  #   ①PrismML prism 分支自己的问题，还是 ②换环境/换模型都能复现的普遍问题。
  # ==========================================================================
  verify-decode:
    strategy:
      fail-fast: false
      matrix:
        branch: [prism, master]
    runs-on: ubuntu-latest
    steps:
      - name: 克隆 llama.cpp（${{ matrix.branch }} 分支）
        run: |
          git clone --branch ${{ matrix.branch }} --depth 1 https://github.com/PrismML-Eng/llama.cpp llamacpp
          cd llamacpp
          git submodule update --init --recursive || true

      - name: 编译 llama-cli（x86，关掉激进指令集）
        run: |
          cd llamacpp
          cmake -B build \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=OFF
          cmake --build build --target llama-cli -j4
          ls -lh build/bin/

      - name: 下载测试模型（Qwen2.5-0.5B Q4_K_M）
        run: |
          curl -sL --max-time 600 -o /tmp/q.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" \
            || curl -sL --max-time 600 -o /tmp/q.gguf \
            "https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          ls -lh /tmp/q.gguf
          head -c 4 /tmp/q.gguf | xxd

      - name: 跑推理（关键：看能不能出字）
        run: |
          cd llamacpp
          echo "========== 参数 =========="
          ./build/bin/llama-cli --version || true
          echo "========== 开始推理 =========="
          set +e
          timeout 300 ./build/bin/llama-cli \
            -m /tmp/q.gguf \
            -p "你好" \
            -n 32 \
            -t 2 \
            -no-cnv \
            --no-warmup 2>&1 | tail -80
          echo "========== 退出码: $? =========="
          echo "如果上面有中文输出，说明这个分支的 decode 在 x86 上是好的"

  # ==========================================================================
  # ARM64 复现：交叉编译同一份 prism 源码到 aarch64，用 qemu 跑，
  # 直接看 ARM 上 llama_decode 到底会不会崩、崩在哪。
  # ==========================================================================
  repro-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装交叉编译器和 qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user

      - name: 克隆 llama.cpp (prism)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp llamacpp
          cd llamacpp && git submodule update --init --recursive || true

      - name: 交叉编译 libllama (aarch64 静态)
        run: |
          cd llamacpp
          cmake -B build-arm \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake-aarch64-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_APP=OFF
          cmake --build build-arm --target llama -j4
          find build-arm -name "*.a" | head -20

      - name: 编译 harness (静态链接)
        run: |
          cd llamacpp
          LIBS=$(find build-arm -name "*.a" | tr '\n' ' ')
          aarch64-linux-gnu-g++ -O1 -g -std=c++17 -static \
            -I include -I ggml/include \
            ../tools/harness.cpp \
            -Wl,--start-group $LIBS -Wl,--end-group \
            -lpthread -lm -ldl -o /tmp/harness_arm
          file /tmp/harness_arm

      - name: 下载测试模型
        run: |
          curl -sL --max-time 900 -o /tmp/q.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" \
            || curl -sL --max-time 900 -o /tmp/q.gguf \
            "https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          ls -lh /tmp/q.gguf

      - name: qemu 运行 (关键)
        run: |
          set +e
          timeout 900 qemu-aarch64 -L /usr/aarch64-linux-gnu /tmp/harness_arm /tmp/q.gguf "你好" 2>&1 | tail -60
          echo "=========== exit=$? ==========="

  # ==========================================================================
  # 分水岭实验：用 Android NDK 编译同一份 harness，在 qemu 里跑。
  # 如果 NDK 编的也崩 → 编译工具链/优化问题
  # 如果 NDK 编的正常 → Android 运行时(bionic/Scudo/ART)问题
  # ==========================================================================
  repro-ndk:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user g++-aarch64-linux-gnu clang

      - name: 克隆 llama.cpp (主线)
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp llamacpp

      - name: 用 clang 交叉编译 libllama (aarch64 静态)
        run: |
          cd llamacpp
          cmake -B build-clang \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
            -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF
          cmake --build build-clang --target llama -j4

      - name: 用 clang 编 harness (静态)
        run: |
          cd llamacpp
          LIBS=$(find build-clang -name "*.a" | tr '\n' ' ')
          clang++ --target=aarch64-linux-gnu -O1 -g -std=c++17 -static \
            -I include -I ggml/include \
            ../tools/harness.cpp $LIBS -lpthread -lm -ldl \
            -o /tmp/harness_clang
          file /tmp/harness_clang

      - name: 下载测试模型
        run: |
          curl -sL --max-time 900 -o /tmp/q.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf" \
            || curl -sL --max-time 900 -o /tmp/q.gguf \
            "https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          ls -lh /tmp/q.gguf

      - name: qemu 运行 clang 版本
        run: |
          set +e
          timeout 900 qemu-aarch64 /tmp/harness_clang /tmp/q.gguf "hello" 2>&1 | tail -50
          echo "=========== exit=$? ==========="
