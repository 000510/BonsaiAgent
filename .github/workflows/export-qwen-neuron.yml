name: export-qwen-neuron

# 把 Qwen3 导出成 MediaTek NPU 格式（.pte + .dlc）
# 依据：executorch/examples/mediatek/README.md + shell_scripts/export_qwen.sh
# 前置：仓库 release(tag=sdk) 含 sdk_libs.tar.gz、mtk_neuron.whl、mtk_converter.whl

on:
  workflow_dispatch:
    inputs:
      model:
        description: "模型：Qwen3-1.7B 或 Qwen3-4B"
        default: "Qwen3-1.7B"
      chunks:
        description: "num_chunks（必须整除层数：1.7B=28层→4/7/14；4B=36层→4/6/9/12）"
        default: "7"
      tokens:
        description: "prompt_num_tokens"
        default: "128"
      cache:
        description: "cache_size"
        default: "512"
      precision:
        description: "precision"
        default: "A16W4"
      platform:
        description: "platform: DX3=Dimensity9300(你的机), DX4=Dimensity9400"
        default: "DX3"

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 环境自检
        run: |
          python3 -V; df -h /; free -g; nproc

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 增加 swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=32768 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -g; swapon --show

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git wget curl unzip build-essential libssl-dev

      - name: 拉取 SDK 与转换工具
        run: |
          mkdir -p $HOME/sdk
          BASE="https://github.com/${{ github.repository }}/releases/download/sdk"
          for f in sdk_libs.tar.gz mtk_neuron.whl mtk_converter.whl; do
            echo "downloading $f"
            curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o $HOME/sdk/$f "$BASE/$f"
          done
          tar -xzf $HOME/sdk/sdk_libs.tar.gz -C $HOME/sdk
          ls -lh $HOME/sdk

      - name: 克隆 ExecuTorch
        run: |
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/pytorch/executorch.git
          du -sh executorch; df -h /

      - name: 安装 Python 依赖
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          cd $HOME/sdk
          cp mtk_neuron.whl "mtk_neuron-8.2.23-py3-none-linux_x86_64.whl"
          cp mtk_converter.whl "mtk_converter-8.13.0+public-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          pip3 install "./mtk_neuron-8.2.23-py3-none-linux_x86_64.whl"
          pip3 install "./mtk_converter-8.13.0+public-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          pip3 install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip3 install "transformers==4.46.3" "tokenizers==0.20.3" huggingface_hub \
                       safetensors sentencepiece accelerate
          if [ -f executorch/examples/mediatek/requirements.txt ]; then
            pip3 install -r executorch/examples/mediatek/requirements.txt || echo "部分依赖失败，继续"
          fi
          pip3 install datasets piq pillow || true
          cd $GITHUB_WORKSPACE/executorch && pip3 install -e . || pip3 install executorch
          pip3 install --force-reinstall "huggingface_hub==0.30.2" "datasets==3.2.0"
          pip3 install --force-reinstall --no-deps "transformers==4.46.3" "tokenizers==0.20.3"
          python3 -c "import transformers, tokenizers, mtk_converter, torch, datasets, huggingface_hub; print('tfm', transformers.__version__, '| tok', tokenizers.__version__, '| hub', huggingface_hub.__version__, '| torch', torch.__version__)"

      - name: 下载模型权重
        env:
          GH_MODEL: ${{ github.event.inputs.model }}
        run: |
          cd "$GITHUB_WORKSPACE/executorch/examples/mediatek/models/llm_models/weights/$GH_MODEL"
          ls -la
          python3 - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          m = os.environ["GH_MODEL"]
          p = snapshot_download(
              repo_id="Qwen/" + m,
              local_dir=".",
              ignore_patterns=["config.json", "*.md", ".gitattributes", "*.gitattributes"],
          )
          print("downloaded to", p)
          PY
          du -sh .; ls -lh; free -g; df -h /

      - name: 导出 .pte / .dlc
        run: |
          cd executorch/examples/mediatek
          export OMP_NUM_THREADS=4 MKL_NUM_THREADS=4
          echo "=== 导出前内存 ==="; free -g
          ( while true; do echo "[mem $(date +%T)] $(free -m | awk '/Mem:/{print "used="$3"MB avail="$7"MB"}') swap_used=$(free -m | awk '/Swap:/{print $3}')MB"; sleep 20; done ) &
          MON=$!
          bash shell_scripts/export_qwen.sh ${{ github.event.inputs.model }} \
            ${{ github.event.inputs.chunks }} \
            ${{ github.event.inputs.tokens }} \
            ${{ github.event.inputs.cache }} \
            None \
            ${{ github.event.inputs.precision }} \
            ${{ github.event.inputs.platform }}
          echo "exit=$?"
          kill $MON 2>/dev/null || true
          echo "=== 导出后内存 ==="; free -g

      - name: OOM 诊断
        if: always()
        run: |
          echo "--- dmesg oom ---"
          sudo dmesg 2>/dev/null | grep -i -E "out of memory|oom-kill|killed process" | tail -20 || echo "无 OOM 记录"
          free -g
          df -h /

      - name: 收集产物
        if: always()
        run: |
          mkdir -p out
          echo "--- 搜索生成文件 ---"
          find executorch/examples/mediatek -type f \( -name "*.pte" -o -name "*.dlc" \) -exec ls -lh {} \; | head -20
          find executorch/examples/mediatek -type f \( -name "*.pte" -o -name "*.dlc" \) -exec cp -v {} out/ \; || true
          ls -lh out/ || echo "无产物"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-neuron-export
          path: out/
          if-no-files-found: warn
