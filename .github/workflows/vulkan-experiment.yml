name: vulkan-experiment

# 独立实验：只验证「llama.cpp 的 Vulkan 后端能不能给 Android arm64 编出来」，
# 不碰主构建流程，不影响任何已发布版本。
#
# 背景（上一轮六次失败的原因，全部记在这里，别再踩）：
#   1. NDK r26 自带 vulkan_core.h 是 1.3.237
#   2. llama.cpp 新代码用到 VkPhysicalDeviceCooperativeMatrixFeaturesKHR、
#      LayerSettingEXT 等 1.3.258+ 才有的类型 → 编译直接挂
#   → 结论：必须换 NDK r27（自带 1.3.290）+ 匹配版本的 vulkan.hpp + SPIRV 头
on:
  workflow_dispatch:
    inputs:
      ndk_version:
        description: 'NDK release name (r27c / r27 / r28)'
        required: true
        default: 'r27c'
      vk_version:
        description: 'Vulkan-Headers tag (must match NDK header)'
        required: true
        default: 'v1.3.290'

jobs:
  build-vulkan:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 装 NDK r27（关键：r26 的 Vulkan 头太老）
        run: |
          # 注意：Google 的下载文件名用的是 r27c 这种发布名，不是 27.2.12479018 内部号
          NDK="${{ inputs.ndk_version }}"
          URL="https://dl.google.com/android/repository/android-ndk-${NDK}-linux.zip"
          echo "downloading $URL"
          curl -fsSL --retry 3 -o ndk.zip "$URL"
          ls -lh ndk.zip
          unzip -q ndk.zip
          export NDK_DIR="$PWD/android-ndk-${NDK}"
          echo "ANDROID_NDK=$NDK_DIR" >> $GITHUB_ENV
          echo "--- 确认 NDK 里的 Vulkan 头版本（必须 ≥1.3.258）---"
          grep -m1 "VK_HEADER_VERSION " "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan_core.h" || true
          ls "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/" | head

      - name: 检查工具链（完全不用 apt）
        run: |
          # GitHub runner 自带 cmake / ninja / unzip。
          # glslc 用 NDK 自带的 —— r26 以后 NDK 就打包了 shader 工具，
          # 之前非要 apt 装 glslang-tools，白白多一个失败点。
          cmake --version | head -1
          ninja --version
          GLSLC="$ANDROID_NDK/shader-tools/linux-x86_64/glslc"
          ls -l "$GLSLC"
          "$GLSLC" --version | head -2
          echo "GLSLC=$GLSLC" >> $GITHUB_ENV

      - name: 下载匹配版本的 Vulkan-Headers + SPIRV-Headers
        run: |
          # 关键：vulkan.hpp 必须和 NDK 的 vulkan_core.h 版本号完全一致，
          # 否则 ggml-vulkan.cpp 的 static_assert 会直接报 "Wrong VK_HEADER_VERSION"。
          # 所以不写死版本，从 NDK 头里读出来再下载对应的。
          NDK_HDR="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan_core.h"
          VER=$(grep -oP '#define VK_HEADER_VERSION\s+\K[0-9]+' "$NDK_HDR" | head -1)
          echo "NDK VK_HEADER_VERSION = $VER"
          if [ -z "$VER" ]; then echo "::error::读不到 NDK 的 Vulkan 版本"; exit 1; fi

          OK=0
          for TAG in "v1.3.$VER" "sdk-1.3.$VER.0" "vulkan-sdk-1.3.$VER.0" "v1.3.$VER.0"; do
            echo "尝试 $TAG ..."
            if curl -fsSL --retry 2 "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/${TAG}.tar.gz" -o vk.tar.gz; then
              tar xzf vk.tar.gz
              VKDIR=$(ls -d Vulkan-Headers-* 2>/dev/null | head -1)
              if [ -n "$VKDIR" ] && [ -f "$VKDIR/include/vulkan/vulkan.hpp" ]; then
                HDRVER=$(grep -oP '#define VK_HEADER_VERSION\s+\K[0-9]+' "$VKDIR/include/vulkan/vulkan_core.h" | head -1)
                echo "下载到 $TAG，其 VK_HEADER_VERSION = $HDRVER"
                if [ "$HDRVER" = "$VER" ]; then OK=1; break; fi
              fi
            fi
          done
          if [ "$OK" != "1" ]; then echo "::error::没找到匹配 $VER 的 Vulkan-Headers"; exit 1; fi

          echo "VULKAN_INCLUDE=$PWD/$VKDIR/include" >> $GITHUB_ENV
          echo "VULKAN_ROOT=$PWD/$VKDIR" >> $GITHUB_ENV
          ls "$VKDIR/include/vulkan" | head

          # SPIR-V 头（glslc 产物 + llama.cpp CMake 需要）
          SV="v2024.4"
          curl -fsSL --retry 3 "https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/${SV}.tar.gz" -o spirv.tar.gz || \
          curl -fsSL --retry 3 "https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/heads/main.tar.gz" -o spirv.tar.gz
          tar xzf spirv.tar.gz
          SV_DIR=$(ls -d SPIRV-Headers-* 2>/dev/null | head -1)
          echo "SPIRV_DIR=$PWD/$SV_DIR" >> $GITHUB_ENV
          ls "$SV_DIR/include/spirv" | head -3

      - name: 克隆 llama.cpp（prism 分支，和 App 用的一致）
        run: |
          git clone --depth 1 -b prism https://github.com/PrismML-Eng/llama.cpp.git llama.cpp || \
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cd llama.cpp
          git log --oneline -1

      - name: 打 sgemm 补丁（和正式构建保持一致，避免形状断言）
        run: python3 "$GITHUB_WORKSPACE/tools/patch_sgemm.py" llama.cpp/ggml/src/ggml-cpu/llamafile/sgemm.cpp

      - name: CMake 配置（Vulkan 开，指向自定义头）
        run: |
          cd llama.cpp
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_BACKEND_DL=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DGGML_LLAMAFILE=ON \
            -DCMAKE_CXX_FLAGS="-I$VULKAN_INCLUDE" \
            -DCMAKE_C_FLAGS="-I$VULKAN_INCLUDE" \
            -DVulkan_GLSLC_EXECUTABLE=$GLSLC \
            -DVulkan_INCLUDE_DIR=$VULKAN_INCLUDE \
            -DVulkanHeaders_DIR=$VULKAN_INCLUDE \
            -DSPIRV-Headers_DIR=$SPIRV_DIR \
            -DSPIRV_HEADERS_INCLUDE_DIR=$SPIRV_DIR/include \
            2>&1 | tail -40

      - name: 编译
        run: |
          cd llama.cpp
          # 编整个项目：Vulkan 后端在 GGML_BACKEND_DL=ON 下才会生成独立的 libggml-vulkan.so
          cmake --build build-android -- -j$(nproc) 2>&1 | tail -30
          echo "=== 构建完成，产物清单 ==="
          find build-android -name "*.so" -exec ls -lh {} \; 2>/dev/null

      - name: 检查产物
        run: |
          echo "=== 所有 .so ==="
          find llama.cpp/build-android -name "*.so" -exec ls -lh {} \; 2>/dev/null || true
          echo "=== 含 vulkan 的产物 ==="
          find llama.cpp/build-android -iname "*vulkan*" 2>/dev/null | head -20 || true
          VK=$(find llama.cpp/build-android -name "libggml-vulkan.so" | head -1)
          if [ -n "$VK" ]; then
            echo "::notice::成功编出 $VK"
            file "$VK"
          else
            echo "::warning::没生成独立的 libggml-vulkan.so"
            # 看看是不是静态链进了 libggml.so
            GG=$(find llama.cpp/build-android -name "libggml.so" | head -1)
            if [ -n "$GG" ]; then
              echo "检查 libggml.so 里是否含 vulkan 符号："
              nm -D "$GG" 2>/dev/null | grep -c "ggml_backend_vk" || echo "0"
            fi
          fi

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-libs
          path: |
            llama.cpp/build-android/**/*.so
            llama.cpp/build-android/**/*.so.*
          if-no-files-found: warn
