name: export-qwen3-4b-neuron

# 目标：把 Qwen3-4B 导出成 MediaTek NPU 能跑的格式（.pte + .dlc）
# 依据：executorch/examples/mediatek/README.md + shell_scripts/export_qwen.sh
# 前置：仓库 release(tag=sdk) 需含：
#   sdk_libs.tar.gz、mtk_neuron.whl、mtk_converter.whl

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "num_chunks"
        default: "4"
      tokens:
        description: "prompt_num_tokens"
        default: "128"
      cache:
        description: "cache_size"
        default: "512"
      precision:
        description: "precision (A16W4)"
        default: "A16W4"
      platform:
        description: "platform (DX4)"
        default: "DX4"

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 环境自检
        run: |
          python3 -V
          df -h /
          free -g
          nproc

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git wget curl unzip build-essential libssl-dev

      - name: 拉取 SDK 与转换工具
        run: |
          mkdir -p $HOME/sdk
          BASE="https://github.com/${{ github.repository }}/releases/download/sdk"
          for f in sdk_libs.tar.gz mtk_neuron.whl mtk_converter.whl; do
            echo "downloading $f"
            curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o $HOME/sdk/$f "$BASE/$f"
          done
          tar -xzf $HOME/sdk/sdk_libs.tar.gz -C $HOME/sdk
          ls -lh $HOME/sdk

      - name: 克隆 ExecuTorch
        run: |
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/pytorch/executorch.git
          du -sh executorch
          df -h /

      - name: 安装 Python 依赖
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          # MediaTek 两个转换工具（cp310，系统自带 Python 3.10 正好匹配）
          # 注意：pip 校验 wheel 文件名，必须先还原成标准命名
          cd $HOME/sdk
          cp mtk_neuron.whl "mtk_neuron-8.2.23-py3-none-linux_x86_64.whl"
          cp mtk_converter.whl "mtk_converter-8.13.0+public-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          pip3 install "./mtk_neuron-8.2.23-py3-none-linux_x86_64.whl"
          pip3 install "./mtk_converter-8.13.0+public-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
          # torch CPU 版，减小体积
          pip3 install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip3 install huggingface_hub transformers safetensors sentencepiece accelerate
          # 官方导出脚本依赖（datasets 必须，否则 qwen.py 直接 ModuleNotFoundError）
          if [ -f executorch/examples/mediatek/requirements.txt ]; then
            pip3 install -r executorch/examples/mediatek/requirements.txt || echo "部分依赖失败，继续"
          fi
          pip3 install datasets piq pillow tokenizers || true
          cd executorch && pip3 install -e . || pip3 install executorch
          python3 -c "import mtk_converter, torch, datasets; print('mtk_converter OK, torch', torch.__version__)"

      - name: 下载 Qwen3-4B 权重
        run: |
          cd executorch/examples/mediatek/models/llm_models/weights/Qwen3-4B
          ls -la
          echo "--- 下载（保留仓库自带 config.json）---"
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          p = snapshot_download(
              repo_id="Qwen/Qwen3-4B",
              local_dir=".",
              ignore_patterns=["config.json", "*.md", ".gitattributes", "*.gitattributes"],
          )
          print("downloaded to", p)
          PY
          ls -lh
          df -h /

      - name: 导出 .pte / .dlc
        run: |
          cd executorch/examples/mediatek
          echo "=== 开始导出 Qwen3-4B ==="
          bash shell_scripts/export_qwen.sh Qwen3-4B \
            ${{ github.event.inputs.chunks }} \
            ${{ github.event.inputs.tokens }} \
            ${{ github.event.inputs.cache }} \
            None \
            ${{ github.event.inputs.precision }} \
            ${{ github.event.inputs.platform }} || echo "导出脚本返回非零，继续检查产物"

      - name: 收集产物
        run: |
          mkdir -p out
          echo "--- 搜索生成文件 ---"
          find executorch/examples/mediatek -type f \( -name "*.pte" -o -name "*.dlc" -o -name "*.bin" \) -size +1M -exec ls -lh {} \; | head -30
          find executorch/examples/mediatek -type f \( -name "*.pte" -o -name "*.dlc" \) -size +1M -exec cp -v {} out/ \; || true
          ls -lh out/ || echo "无产物"

      - uses: actions/upload-artifact@v4
        with:
          name: qwen3-4b-neuron
          path: out/
          if-no-files-found: warn
